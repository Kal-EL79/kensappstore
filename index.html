<!DOCTYPE html>
<html>
<head>
    <title>App Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="hero-banner">
    <img src="images/myheader.png" alt="Kens App Store">
</div>

<div id="lock-screen">
    <h1>Enter Access Code</h1>
    <input type="password" id="passcode" placeholder="Enter code">
    <button onclick="unlockSite()">Enter</button>
    <p id="error"></p>
</div>

<div id="app-store" style="display:none;">

    <h2>APPS</h2>

    <div class="apps">
        <div class="card">
            <img src="images/tivimate7.png">
            <h3>Underground Tivimate 7.0</h3>
            <a href="https://github.com/Kal-EL79/kensappstore/releases/download/v1.0/UNDERGROUND.Tivimate.7.0.apk">
                Download App
            </a>
        </div>
        <div class="card">
    <img src="images/onstream.png">
    <h3>Onstream</h3>
    <a href="https://github.com/Kal-EL79/kensappstore/releases/download/v1.0/onstream.apk">
        Download App
    </a>
</div>
        <div class="card">
    <img src="images/beetv.png">
    <h3>Bee TV</h3>
    <a href="https://github.com/Kal-EL79/kensappstore/releases/download/v1.0/beetv.apk">
        Download App
    </a>
</div>
        <div class="card">
    <img src="images/flixvision.png">
    <h3>Flixvision</h3>
    <a href="https://github.com/Kal-EL79/kensappstore/releases/download/v1.0/FlixVision_v3.6.3.apk">
        Download App
    </a>
</div> 
        <div class="card">
    <img src="images/filmplus.png">
    <h3>Film Plus</h3>
    <a href="https://github.com/Kal-EL79/kensappstore/releases/download/v1.0/filmplus.apk">
        Download App
    </a>
</div>
        <div class="card">
    <img src="images/novatv.png">
    <h3>Nova TV</h3>
    <a href="https://github.com/Kal-EL79/kensappstore/releases/download/v1.0/UNDERGROUND.Tivimate.7.0.apk">
        Download App
    </a>
</div>    </div>

</div>

<script>
function unlockSite() {
    var code = document.getElementById("passcode").value;

    if (code === "61799") {
        document.getElementById("lock-screen").style.display = "none";
        document.getElementById("app-store").style.display = "block";
    } else {
        document.getElementById("error").innerText = "Incorrect Code";
    }
}
</script>

</body>
</html>
