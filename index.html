<!DOCTYPE html>

<body>

<div class="hero-banner">
    <img src="images/myheader.png" alt="Kens App Store">

<body>

<div id="lock-screen">
    <h1>Enter Access Code</h1>
    <input type="password" id="passcode" placeholder="Enter code">
    <button onclick="unlockSite()">Enter</button>
    <p id="error"></p>
</div>

<div id="app-store" style="display:none;">

    <div class="hero-banner">
        <img src="images/myheader.png" alt="Kens App Store">
    </div>

    <!-- Put your APK cards here later -->

</div>

<script>
function unlockSite() {
    var code = document.getElementById("passcode").value;

    if (code === "61799") {
        document.getElementById("lock-screen").style.display = "none";
        document.getElementById("app-store").style.display = "block";
    } else {
        document.getElementById("error").innerText = "Incorrect Code";
    }
}
</script>

</body>
<h2>APPS</h2>

<div class="apps">

    <div class="card">
        <img src="images/tivimate7.png">
        <h3>My App</h3>
        <a href="https://github.com/Kal-EL79/kensappstore/releases/download/v1.0/MyApp.apk">
            Download App
        </a>
    </div>

</div>
